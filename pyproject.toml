[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discord-tts-bot"
version = "4.2.0"
description = "A Text-to-Speech bot for Discord with Piper TTS support"
authors = [
    {name = "moonstar-x", email = "moonstar-x@example.com"}
]
requires-python = ">=3.12"
dependencies = [
    "piper-tts==1.3.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.uv]
required-version = ">=0.1.0"
