name: 🚀 Build and Deploy

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "How to increment the version (ignored when custom_tag is set). 'rebuild' rebuilds the image for the current tag without bumping the version—use it when only the base image or language version changed, not the code."
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - rebuild
      custom_tag:
        description: "Custom tag (e.g., v1.2.3). Overrides the automatic bump when set."
        required: false
        type: string
      prerelease:
        description: "Marcar como pre-release?"
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    name: 🚀 Build, Push & Deploy
    uses: devidence-dev/workflows/.github/workflows/cd-build-deploy-semver.yml@v1
    with:
      app_name: discord-tts-bot
      inject_version_and_date_build_args: true
      values_path: kubernetes/internal-apps/discord-tts-bot/values.yaml
      bump: ${{ inputs.bump }}
      custom_tag: ${{ inputs.custom_tag }}
      prerelease: ${{ inputs.prerelease }}
    secrets:
      HOMELAB_DEPLOY_TOKEN: ${{ secrets.HOMELAB_DEPLOY_TOKEN }}
    permissions:
      contents: write
      id-token: write
